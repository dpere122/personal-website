<div class="container-fluid terminal-container">
  <!-- Terminal window structure -->
  <div class="window col-12 col-sm-10 col-md-10 col-xxl-6">
    <!-- Liquid Glass Window Handle -->
    <div class="window-handle">
      <div class="handle-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <span class="handle-title">{{ title }}</span>
    </div>

    <!-- VHS screen overlay effects - now inside the terminal window -->
    <div class="screen-overlay"></div>
    <div class="scan-lines"></div>
    <div class="flicker"></div>

    <!-- Main content -->
    <div class="content terminal-content">
      <!-- Loading / error states -->
      <div *ngIf="loading" class="status-message">
        <span class="prompt">$</span>
        <span class="command">fetching repos...</span>
      </div>
      <div *ngIf="error" class="status-message error">
        <span class="prompt">$</span>
        <span class="command">{{ error }}</span>
      </div>

      <!-- Repo list -->
      <div *ngIf="!loading && !error" class="repo-list">
        <div class="command-line">
          <span class="prompt">$</span>
          <span class="command">gh repo list dpere122</span>
        </div>

        <div class="repo-cards-wrapper" [@pageTransition]="currentPage">
          <div class="repo-card" *ngFor="let repo of repos">
            <div class="repo-header">
              <span class="repo-name">{{ repo.repoName }}</span>
              <a
                [href]="repo.repoURL"
                target="_blank"
                rel="noopener noreferrer"
                class="repo-link"
              >
                [open]
              </a>
            </div>
            <div class="repo-description" *ngIf="repo.repoDescription">
              {{ repo.repoDescription }}
            </div>
            <div class="repo-url">
              <a
                [href]="repo.repoURL"
                target="_blank"
                rel="noopener noreferrer"
              >
                {{ repo.repoURL }}
              </a>
            </div>
          </div>

          <!-- Placeholder cards for missing repos -->
          <div class="repo-card placeholder" *ngFor="let _ of placeholders">
            <div class="repo-header">
              <span class="repo-name coming-soon">Coming Soon</span>
            </div>
            <div class="repo-description">New project in progress...</div>
          </div>
        </div>

        <!-- Pagination controls -->
        <div class="pagination-controls">
          <button
            class="page-btn"
            (click)="loadPreviousPage()"
            [disabled]="!hasPreviousPage || loading"
          >
            &larr; Previous
          </button>
          <span class="page-info">
            Page {{ currentPage }} of {{ totalPages }} ({{ totalCount }} total
            repos)
          </span>
          <button
            class="page-btn"
            (click)="loadNextPage()"
            [disabled]="!hasNextPage || loading"
          >
            Next &rarr;
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
