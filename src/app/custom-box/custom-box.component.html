<div class="container-fluid custom-box">
  <div class="window col-12 col-sm-10 col-md-10 col-xxl-6">
    <div class="window-handle">
      <div class="handle-dots">
        <span class="dot dot-red"></span>
        <span class="dot dot-yellow"></span>
        <span class="dot dot-green"></span>
      </div>
      <span class="handle-title">✚</span>
    </div>
    <app-terminal-input
      class="terminal-full-height"
      [resumeData]="resumeData"
    ></app-terminal-input>
  </div>
</div>
