<nav class="navbar navbar-expand-lg navbar-dark">
  <div class="container-fluid" style="display: inline">
    <div class="row">
      <div class="col-12 col-lg-12 col-sm-12">
        <div class="navbar-wrapper">
          <div class="navbar-brand-container">
            <h1 class="title mb-0">Daniel</h1>
            <h1 class="sub-title mb-0">Full Stack Developer</h1>
          </div>


          <div
            class="navbar-collapse"
            id="navbarNav"
            [@collapseAnimation]="isNavbarCollapsed ? 'open' : 'closed'"
          >
            <ul class="navbar-nav">
              <li class="nav-item" *ngFor="let page of pages">
                <a
                  class="nav-link"
                  [class.active]="isActive(page)"
                  (click)="navigateToPage(page)"
                >
                  {{ page }}
                </a>
              </li>
            </ul>
          </div>
          <div class="navbar-controls ms-auto" style="background-color: black">
            <button
              class="navbar-toggler d-lg-none"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
              aria-controls="navbarNav"
              aria-expanded="false"
              aria-label="Toggle navigation"
              (click)="toggleNavbar()"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
